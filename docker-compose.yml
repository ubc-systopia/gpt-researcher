services:
  vllm-server:
    image: vllm/vllm-openai:latest
    container_name: vllm-server
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - researcher-net
    ports:
      - "7000:7000"
    ipc: host
    command: ["--model", "openai/gpt-oss-20b", "--host", "0.0.0.0", "--port", "7000"]
    restart: unless-stopped

  gpt-researcher-cli:
    build: .
    container_name: gpt-researcher-cli
    networks:
      - researcher-net
    env_file:
      - .env
    user: root
    volumes:
      - ./outputs:/app/outputs
      - ./logs:/app/logs
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for vllm-server to be ready...';
      while ! python3 -c 'import urllib.request; urllib.request.urlopen(\"http://vllm-server:7000/health\")' 2>/dev/null; do
          sleep 5;
      done;
      echo 'vllm-server is ready!';
      python cli.py \"Explain the impact of 6G on edge AI\" --report_type research_report --tone analytical --use_multi_agent"

networks:
  researcher-net:
    driver: bridge
